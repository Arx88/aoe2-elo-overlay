name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Dependencias
        run: npm ci

      # El selftest consulta APIs públicas de AoE2: si están caídas no debe
      # bloquear la publicación de una versión.
      - name: Tests
        run: npm run selftest
        continue-on-error: true

      - name: Build y publicación del Release
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Solo el release actual: antes había un paso con v0.1.9 hardcodeado
      # que sobreescribía las notas de esa versión en cada publicación.
      - name: Notas del release actual
        shell: bash
        run: gh release edit "${{ github.ref_name }}" --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub marca el tag como "latest" en cuanto se crea el release, pero
      # los assets tardan unos minutos en subirse. En esa ventana el updater
      # recibe un 404 de latest.yml: src/updater.js lo trata como
      # "publicándose" y reintenta solo, sin mostrar un error al jugador.
      # Este paso garantiza que el canal quedó completo antes de dar por bueno
      # el workflow.
      - name: Verificar el canal de actualizaciones
        shell: bash
        run: gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name' | grep -Fxq 'latest.yml'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
