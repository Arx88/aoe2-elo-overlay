name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Dependencias
        run: npm ci

      # El selftest consulta APIs públicas de AoE2: si están caídas no debe
      # bloquear la publicación de una versión.
      - name: Tests
        run: npm run selftest
        continue-on-error: true

      - name: Build y publicación del Release
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notas del release actual
        shell: bash
        run: gh release edit "${{ github.ref_name }}" --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notas del release anterior
        shell: bash
        continue-on-error: true
        run: gh release edit v0.1.9 --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
