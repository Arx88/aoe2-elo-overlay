<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'"
    />
    <title>AoE2 ELO Overlay</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="stage">
      <div id="panel">
        <div id="head">AoE2 ELO</div>
        <!--
          Balance de equipos (opcional, TG): promedio de ELO RM 1v1 por
          equipo. Lo llena renderer.js solo cuando hay roster con ELOs y dos
          equipos; vive dentro del panel, así que se oculta con él a 0:20.
        -->
        <div id="balance" hidden aria-live="polite"></div>
        <!--
          Barrita de análisis: mientras se buscan los datos del rival o se
          analizan replays, el panel lo dice y la barra se mueve. Cuando no
          falta nada se oculta sola: en partida no queda nada animado.
        -->
        <div id="analysis" hidden aria-live="polite">
          <span class="analysis-label" id="analysisLabel">Analizando…</span>
          <span class="analysis-track" aria-hidden="true"><i></i></span>
        </div>
        <div id="rows"><div class="hint">Iniciando…</div></div>
        <div id="foot"><span id="foottext"></span></div>
      </div>

      <!--
        Aviso de actualización: chip temporal, sin botones (el panel es
        click-through). Se oculta solo y nunca aparece en media partida.
      -->
      <section id="updateToast" hidden aria-live="polite">
        <span class="upd-dot" aria-hidden="true"></span>
        <span id="updateToastText"></span>
      </section>

      <!--
        Ayuda de civ: la llena renderer.js con el dataset offline en español.
        El main la muestra a 0:01 y la oculta a 0:20 usando el reloj REAL de
        la partida (raw.started del REST), no un timer desde que se detecta.
      -->
      <section id="civHelp" hidden aria-live="polite">
        <div class="civhelp-head">
          <span class="civhelp-title"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4.8 5.9v5.3c0 4.1 3 7.4 7.2 9.8 4.2-2.4 7.2-5.7 7.2-9.8V5.9L12 3Z"/></svg>Ayuda de civ</span>
          <span class="civhelp-clock" id="civhelpClock">0:01 / 0:20</span>
        </div>
        <div class="civhelp-grid" id="civhelpGrid"></div>
        <div class="civhelp-bar"><i id="civhelpBar"></i></div>
      </section>

      <!--
        SCOUTING UNIFICADO (v0.1.24): UNA sola sección y UNA tarjeta por rival.
        Es la vista por defecto (compacta): un escudo grande, UN número que
        grita, una barra de reparto, UNA acción concreta y una línea de
        proveniencia. Todo lo demás queda detrás de F2. Antes había dos
        secciones con dos cabeceras, el mismo nombre repetido y ~10 cifras
        compitiendo por una ventana de 10 s de lectura real.
      -->
      <section id="scouting" hidden aria-live="polite">
        <div class="scout-head">
          <span class="scout-title"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 17.2h5"/><path d="M10.2 20h3.6"/><path d="M12 3.2a5.8 5.8 0 0 0-3.4 10.5c.6.4 1 1.1 1 1.8v.3h4.8v-.3c0-.7.4-1.4 1-1.8A5.8 5.8 0 0 0 12 3.2Z"/></svg>Scouting</span>
          <span class="scout-context" id="scoutContext"></span>
          <!-- El overlay es click-through: el chip es SOLO la pista del atajo. -->
          <span class="scout-toggle" id="scoutToggle">F2 · Ver todo</span>
        </div>
        <div class="scout-grid" id="scoutCards"></div>
        <!-- Honestidad de muestra y alcance: UNA vez por sección. -->
        <p class="scout-footnote" id="scoutFootnote" hidden></p>
      </section>

      <!--
        VISTA DE DETALLE (F2). Informe OPCIONAL del rival: últimas 5 civs,
        civ/mapa favoritos, H2H y aperturas REALES de AoE2Insights. Se calcula
        en segundo plano y se va completando por partes, sin retrasar el ELO.
        En modo compacto estas dos secciones están ocultas.
      -->
      <section id="rivalInfo" hidden aria-live="polite">
        <div class="rival-head">
          <span class="rival-title"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 4.5h3.6l9 9"/><path d="m13.6 17.4 3.8-3.8 1.9 1.9-3.8 3.8-1.9-1.9Z"/><path d="M19.5 4.5h-3.6l-9 9"/><path d="m10.4 17.4-3.8-3.8-1.9 1.9 3.8 3.8 1.9-1.9Z"/></svg>Informe del rival</span>
          <span class="scout-toggle">F2 · Resumen</span>
        </div>
        <div class="rival-grid" id="rivalGrid"></div>
        <!-- Honestidad de muestra: UNA sola vez por sección, no por tarjeta. -->
        <p class="rival-footnote" id="rivalFootnote" hidden></p>
      </section>

      <!--
        VISTA DE DETALLE (F2). RECOMENDACIONES INTELIGENTES (smartTips):
        consejo por rival calculado con replays reales de AoE2Insights.
        Solo vive en la pre-partida (fase `lobby`): al arrancar la partida
        desaparece solo.
      -->
      <section id="scoutInfo" hidden aria-live="polite">
        <div class="rival-head">
          <span class="rival-title"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 17.2h5"/><path d="M10.2 20h3.6"/><path d="M12 3.2a5.8 5.8 0 0 0-3.4 10.5c.6.4 1 1.1 1 1.8v.3h4.8v-.3c0-.7.4-1.4 1-1.8A5.8 5.8 0 0 0 12 3.2Z"/></svg>Recomendaciones</span>
          <span class="scout-toggle">F2 · Resumen</span>
        </div>
        <div class="rival-grid" id="scoutGrid"></div>
      </section>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
